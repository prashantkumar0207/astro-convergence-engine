[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-convergence-engine"
description = "Deterministic, provenance-aware Vedic astrology calculation engine"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "pyswisseph==2.10.3.2",
    "tzdata>=2025.2",
    "jsonschema>=4",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["engine"]

[tool.setuptools.dynamic]
version = {attr = "engine.version.ENGINE_VERSION"}
