name: engine-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyswisseph==2.10.3.2 tzdata jsonschema pytest
      - name: Run test suite (certification gate)
        run: python -m pytest -q
      - name: Run D9 independent holdout validator
        run: python validate_d9_holdout.py
      - name: Run D10 independent holdout validator
        run: python validate_d10_holdout.py
