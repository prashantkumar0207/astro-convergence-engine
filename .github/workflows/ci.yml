# Astro Convergence Engine CI (ADR-0018, Phase G commit 1 / G6).
#
# Two jobs, split by whether an EXTERNAL ORACLE is required. The split exists
# for reproducibility and outage isolation, never for speed. No gate that
# existed before this change was removed or weakened; the hermetic job gains
# nine validators, the legacy gate and three certification runners that CI
# previously never ran.
#
#   no-oracle  : default pytest gate + the independent holdout validators
#              + legacy kernel gate + the non-oracle certification runners
#              (now including certify_kp_significator.py, ADR-0078 - no
#              external oracle exists for KP significators, so it belongs
#              here, not in the oracle-tier job below). A REPRESENTATIVE
#              SUBSET is additionally re-run with an in-process network guard.
#
#              HONEST SCOPE, corrected 2026-08-13. This job is NOT network
#              isolated: the runner has full egress, which it must in order to
#              pip install. The guard patches five socket entry points inside
#              ONE python process (scripts/ci_no_network.py) and is applied to
#              six invocations, not to all fifteen. The job was previously
#              named "hermetic (no oracle, no network)", which claimed more
#              than it delivers. Child processes are not sandboxed.
#   oracle   : the eight PyJHora certification runners, installed hash-pinned
#              from requirements-oracle.lock ALONE, asserting and uploading the
#              environment identity used for certification.
#              NOTE: `pip install --upgrade pip` is NOT hash-pinned, so the
#              environment is lock plus an unpinned pip. requirements.lock,
#              used by the other two jobs, is version-pinned but NOT
#              hash-pinned; only the oracle lock carries hashes.
#
# VALIDATION_STANDARD.md s2 rule 5: skips are failures in certification suites.
# Nothing here uses continue-on-error and no step converts a failure into a
# warning.
#
#   governance : identifier-family conformance and governance-document
#              structure. Added by ADR-0014, having been deliberately deferred
#              by ADR-0018 until G1 removed the 70 retired-identifier
#              occurrences that would have made it fail.

name: engine-ci

on:
  push:
    branches: [main, phase-g-governance]
  pull_request:

jobs:
  hermetic:
    name: no-oracle gate (network guard on a subset, see header)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Record environment
        run: |
          python -c "import sys; print('python', sys.version)"
          python -c "import platform; print('platform', platform.platform(), platform.machine())"
          python -c "import swisseph as swe; print('pyswisseph reports', swe.version)"
          python -m pip freeze

      - name: Verify ephemeris asset checksums
        run: sha256sum --check CHECKSUMS.sha256

      - name: Default gate (engine/tests)
        run: python -m pytest -q

      - name: Independent holdout validators (all fourteen)
        run: |
          set -e
          for v in validate_d9_holdout.py \
                   validate_d10_holdout.py \
                   validate_d2_holdout.py \
                   validate_d3_holdout.py \
                   validate_d7_holdout.py \
                   validate_d12_holdout.py \
                   validate_d30_holdout.py \
                   validate_kp_holdout.py \
                   validate_vimshottari_holdout.py \
                   validate_transits_holdout.py \
                   validate_parashari_drishti_holdout.py \
                   validate_rise_set_holdout.py \
                   validate_panchanga_holdout.py \
                   validate_trikalam_holdout.py; do
            echo "::group::$v"
            python "$v"
            echo "::endgroup::"
          done

      - name: Legacy kernel gate
        run: python -m pytest -q test_tier0_certification.py test_official_swetest_reference.py

      - name: Non-oracle certification runners
        # certify_panchanga.py moved to the oracle job (below): it now
        # requires PyJHora unconditionally for Gate F (genuine external-
        # oracle comparison, CEO-approved 2026-08-19), matching every one
        # of the oracle-tier runners' own import-guard pattern exactly.
        run: |
          set -e
          python scripts/certify_current_engine.py
          python scripts/certify_kp_chain.py
          python scripts/certify_sign_convention.py
          python scripts/certify_rise_set.py
          python scripts/certify_kp_significator.py

      - name: Re-run a representative subset under the in-process network guard
        run: |
          set -e
          python scripts/ci_no_network.py -m pytest -q
          python scripts/ci_no_network.py validate_d9_holdout.py
          python scripts/ci_no_network.py validate_kp_holdout.py
          python scripts/ci_no_network.py validate_kp_significator_holdout.py
          python scripts/ci_no_network.py scripts/certify_current_engine.py
          python scripts/ci_no_network.py scripts/certify_kp_chain.py
          python scripts/ci_no_network.py scripts/certify_sign_convention.py
          python scripts/ci_no_network.py scripts/certify_rise_set.py
          python scripts/ci_no_network.py scripts/certify_kp_significator.py

      - name: Assert the network guard actually blocks (negative control)
        run: |
          # STRENGTHENED 2026-08-13, twice. The original asserted only a nonzero
          # exit, which a missing probe, a renamed guard or a runner with no
          # egress all satisfy. The first strengthening established a baseline
          # but used ONE probe exercising three calls, which short-circuits on
          # whichever patched symbol it reaches first: with two of the five
          # patches deleted it still raised NoNetworkError and still "passed".
          #
          # SEPARATE PROBES, one per entry point, each run twice. Unguarded it
          # must SUCCEED, proving egress exists and the probe is well formed;
          # guarded it must FAIL with NoNetworkError. A patch silently removed
          # from the guard now fails its own probe.
          mkdir -p /tmp/netprobes

          printf 'import socket\nsocket.getaddrinfo("pypi.org", 443)\nprint("ok")\n' \
            > /tmp/netprobes/getaddrinfo.py
          printf 'import socket\nsocket.create_connection(("pypi.org", 443), 10)\nprint("ok")\n' \
            > /tmp/netprobes/create_connection.py
          # Raw IP, so this probe does not depend on DNS and therefore isolates
          # socket.socket.connect from the getaddrinfo patch.
          printf 'import socket\ns=socket.socket()\ns.settimeout(10)\ns.connect(("151.101.0.223", 443))\ns.close()\nprint("ok")\n' \
            > /tmp/netprobes/connect_raw_ip.py
          printf 'import socket\nimport sys\ns=socket.socket()\ns.settimeout(10)\nsys.exit(0 if s.connect_ex(("151.101.0.223", 443)) == 0 else 1)\n' \
            > /tmp/netprobes/connect_ex_raw_ip.py
          printf 'import socket\nsocket.gethostbyname("pypi.org")\nprint("ok")\n' \
            > /tmp/netprobes/gethostbyname.py
          # COVERAGE, stated honestly: four of the guard's five patched symbols
          # are isolated by these probes. create_connection cannot be isolated,
          # because it delegates to getaddrinfo internally, so removing its patch
          # alone leaves the call blocked by the getaddrinfo patch. It is
          # defence in depth over a path already covered, and that is why its
          # probe is retained rather than dropped.

          for probe in /tmp/netprobes/*.py; do
            name=$(basename "$probe")
            echo "::group::network probe $name"
            # 1. unguarded: MUST succeed, or the control proves nothing.
            python "$probe"

            # 2. guarded: MUST fail, and specifically with NoNetworkError.
            set +e
            out=$(python scripts/ci_no_network.py "$probe" 2>&1)
            rc=$?
            set -e
            echo "$out"
            if [ "$rc" -eq 0 ]; then
              echo "network guard did NOT block $name"
              exit 1
            fi
            if ! echo "$out" | grep -q "NoNetworkError"; then
              echo "$name failed, but NOT with NoNetworkError; the failure cannot"
              echo "be attributed to the guard, so this control proves nothing"
              exit 1
            fi
            echo "::endgroup::"
            echo "  $name: egress confirmed, guard blocked it with NoNetworkError"
          done
          rm -rf /tmp/netprobes

      - name: H-02 independent-reference reproduction (DP-013 Option A - investigation, not a certifier)
        run: python scripts/reproduce_h02_ingress_seam.py

      - name: Upload H-02 independent-reference reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h02-reproduction-evidence-${{ matrix.python-version }}
          path: reports/h02_reproduction/reproduction_evidence.json
          if-no-files-found: error

      - name: Upload regenerated non-oracle artifacts, reports and transcripts
        # ADR-0053: this tier regenerates current_engine/KP_CHAIN/SIGN_CONVENTION
        # on Linux successfully, but nothing previously retrieved that evidence -
        # a legitimate drift failure (e.g. after a source change like M-03) left
        # the regenerated artifacts unrecoverable, forcing reliance on a
        # non-reproducing Windows regeneration. Placed AFTER the network-guard
        # re-run (which regenerates the same three files again) and BEFORE the
        # drift assertion, so the upload captures exactly what that assertion
        # examines, and `if: always()` so a legitimate drift failure still
        # uploads for forensic inspection rather than being discarded.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermetic-certification-evidence-${{ matrix.python-version }}
          path: |
            certification/*.json
            reports/certification/*.report.md
            reports/certification/*.console.txt
          if-no-files-found: error

      - name: Assert regenerated artifacts did not drift, then that no source changed
        run: |
          # ORDER MATTERS, corrected 2026-08-13. The previous form ran
          # `git checkout -- certification/ reports/` FIRST, destroying the
          # regenerated artifacts before anything examined them, so drift in
          # this tier was discarded rather than asserted.
          python scripts/check_artifact_drift.py
          git checkout -- certification/ reports/
          # WHOLE TREE, corrected 2026-08-13. An explicit pathspec, however long,
          # always omits something: the previous list missed LOCK_MANIFEST.json,
          # schemas/, knowledge/, pyproject.toml, pytest.ini and root-level
          # documents, while the step's own message claimed "no tracked source
          # file was modified". certification/ and reports/ are restored above,
          # so anything remaining is genuine unexpected drift.
          git status --porcelain > /tmp/source_drift.txt
          if [ -s /tmp/source_drift.txt ]; then
            echo "a certification run modified tracked source:"
            cat /tmp/source_drift.txt
            exit 1
          fi
          echo "no tracked source file was modified by any certification run"

  oracle:
    name: oracle gate (PyJHora, hash-pinned)
    runs-on: ubuntu-latest
    # Python 3.11 only: requirements-oracle.lock carries CPython 3.11 linux
    # x86_64 wheel hashes, matching certification/ORACLE_ENVIRONMENT.json
    # exactly. Another interpreter or platform needs its own lock and its own
    # recorded identity; it must never be obtained by relaxing hashes.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the oracle environment from the lock ALONE (hash-pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-oracle.lock

      - name: Print the environment identity used for certification
        run: |
          echo "=== recorded identity: certification/ORACLE_ENVIRONMENT.json ==="
          cat certification/ORACLE_ENVIRONMENT.json
          echo "=== actual runner identity ==="
          python -c "import sys; print('python', sys.version)"
          python -c "import platform; print('platform', platform.platform(), platform.machine())"
          python -c "import swisseph as swe; print('pyswisseph reports', swe.version)"
          python -c "import importlib.metadata as m; print('PyJHora', m.version('PyJHora'))"
          sha256sum requirements-oracle.lock
          python -m pip freeze

      - name: Assert the runner matches the recorded environment identity
        run: python scripts/check_oracle_environment.py

      - name: Verify ephemeris asset checksums
        run: sha256sum --check CHECKSUMS.sha256

      - name: Oracle certification runners (all eleven)
        run: |
          set -e
          for c in scripts/certify_d2.py \
                   scripts/certify_d3.py \
                   scripts/certify_d7.py \
                   scripts/certify_d12.py \
                   scripts/certify_d30.py \
                   scripts/certify_d45.py \
                   scripts/certify_vimshottari.py \
                   scripts/certify_transits.py \
                   scripts/certify_parashari_drishti.py \
                   scripts/certify_panchanga.py \
                   scripts/certify_trikalam.py; do
            echo "::group::$c"
            python "$c"
            echo "::endgroup::"
          done

      - name: Assert regenerated artifacts drifted only in the volatile fields
        run: |
          # REPLACED 2026-08-13. This step previously ran `git --no-pager diff`,
          # which ALWAYS exits 0. Its name asserted a byte-level invariant that
          # `git diff` cannot enforce, so a changed comparison count, a changed
          # maximum error, a widened tolerance or a removed holdout case would
          # all have been printed into the log and the job would have gone green.
          git --no-pager diff --stat -- certification/ reports/certification/
          python scripts/check_artifact_drift.py

      - name: Upload regenerated artifacts, reports and transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-certification-evidence
          path: |
            certification/*.json
            reports/certification/*.report.md
            reports/certification/*.console.txt
          if-no-files-found: error

      - name: H-02 PyJHora reliability investigation (DP-013 Option B - investigation, not a certifier)
        # Bounded: each precision level runs in its own subprocess with a hard
        # 45s timeout, so a divergent search (already observed locally to
        # diverge at precision=0.0001) can never hang this step or the job.
        run: python scripts/investigate_h02_pyjhora_precision.py

      - name: Upload H-02 PyJHora reliability investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h02-pyjhora-investigation-evidence
          path: reports/h02_reproduction/pyjhora_reliability_investigation.json
          if-no-files-found: error

  governance:
    name: governance gate (identifier families, document structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No third-party dependency: these checks read files and run regexes.
      - name: Identifier-family conformance (ADR-0014)
        run: python scripts/check_retired_identifiers.py

      - name: Decision-paper identifier-family conformance (ADR-0040)
        run: python scripts/check_identifier_families.py

      - name: Negative control, the identifier gate must actually fail
        run: |
          set +e
          # The probe string is ASSEMBLED at run time rather than written
          # literally. A literal here would be a real violation inside a
          # tracked file, and the gate would flag this workflow itself.
          # Found the hard way: the gate caught exactly that on first run.
          python -c "open('_governance_probe.py','w').write('# planted: ' + 'ADR-' + 'VARGA' + '-D3-001' + chr(10))"
          git add -N _governance_probe.py
          python scripts/check_retired_identifiers.py > /dev/null 2>&1
          rc=$?
          git rm -q --cached --force _governance_probe.py 2>/dev/null
          rm -f _governance_probe.py
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "identifier gate did NOT flag a planted retired identifier;"
            echo "the PASS above is therefore worthless"
            exit 1
          fi
          echo "negative control passed: planted violation was caught (exit $rc)"

      - name: ADR numbering is unique and monotonic
        run: python scripts/check_adr_numbering.py

      - name: Negative control, the numbering gate must actually fail (Q14)
        run: |
          # Q14. The numbering gate previously had NO negative control, so its
          # PASS proved only that it ran. The gate and this control execute THE
          # SAME code against different input, so a copy of the rule cannot
          # drift from the rule.
          set +e
          cp docs/DECISION_LOG.md /tmp/register_probe.md
          printf '\n## ADR-0018 - planted duplicate probe\nbody\n' >> /tmp/register_probe.md
          python scripts/check_adr_numbering.py /tmp/register_probe.md > /dev/null 2>&1
          dup=$?
          cp docs/DECISION_LOG.md /tmp/register_probe.md
          # ADR-0016 is RESERVED and unissued, so appending it at the end is
          # out-of-order WITHOUT also being a duplicate. Using an already-issued
          # number here would trip the uniqueness rule too, and the control would
          # pass even if the ordering assertion were deleted outright.
          printf '\n## ADR-0016 - planted out-of-order probe\nbody\n' >> /tmp/register_probe.md
          python scripts/check_adr_numbering.py /tmp/register_probe.md > /dev/null 2>&1
          ooo=$?
          rm -f /tmp/register_probe.md
          set -e
          if [ "$dup" -eq 0 ]; then
            echo "numbering gate did NOT flag a planted duplicate; its PASS is worthless"
            exit 1
          fi
          if [ "$ooo" -eq 0 ]; then
            echo "numbering gate did NOT flag a planted out-of-order entry"
            exit 1
          fi
          echo "negative control passed: duplicate exit $dup, out-of-order exit $ooo"
          test -z "$(git status --porcelain -- docs/DECISION_LOG.md)"

      - name: Governing documents carry a status header
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          # DOCUMENTATION_STANDARD.md s2.1 requires a status header table on
          # governing documents. Applied to the documents this project has
          # brought under that rule; pre-existing HLKG-era documents are not
          # retro-fitted here, that is G7 work.
          REQUIRED = [
              "docs/DECISION_LOG.md",
              "docs/CI_AND_ORACLE_REPRODUCIBILITY_SPEC.md",
              "docs/ENGINE_STATUS.md",
              "docs/VARGA_REGISTRY_SPEC.md",
              "docs/VIMSHOTTARI_DASHA_SPEC.md",
              "docs/TRANSIT_ENGINE_SPEC.md",
              "docs/KP_CHAIN_SPEC.md",
              "docs/PARASHARI_DRISHTI_SPEC.md",
              "docs/SIGN_CONVENTION_SPEC.md",
          ]
          FIELDS = ("Status", "Version", "Owner", "Last updated")
          errors = []
          for rel in REQUIRED:
              head = "\n".join(Path(rel).read_text().splitlines()[:12])
              missing = [f for f in FIELDS if f"| {f} |" not in head]
              if missing:
                  errors.append(f"{rel}: missing header fields {missing}")
          if errors:
              for e in errors:
                  print("FAIL:", e)
              sys.exit(1)
          print(f"PASS: {len(REQUIRED)} governing documents carry a complete status header")
          PY

      - name: Certified varga registry matches its declared constant
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import engine.astrology as ast

          # ADR-0084: a narrow, explicit, per-artifact exemption for a
          # certification artifact that genuinely exists ahead of its own
          # production registration (ADR-0082/ADR-0083's deliberate
          # certify-then-register sequencing for D24). Any OTHER unlisted
          # artifact still fails this check below - this is not a general
          # relaxation of the invariant.
          ALLOWED_PRE_PRODUCTION = {
              "VARGA_D24_V1_certification.json",  # ADR-0083: certification
                  # design/execution only; production registration not yet
                  # separately authorized.
          }

          def check(cert_dir):
              declared = set(tuple(x) for x in ast.CERTIFIED_PRODUCTION_VARGAS)
              expected = {f"VARGA_D{d}_V1_certification.json" for d, _ in declared}
              artifacts = {p.name for p in cert_dir.glob("VARGA_D*_V1_certification.json")}
              errors = []
              # Every declared/registered varga must have its artifact - unchanged.
              missing = expected - artifacts
              if missing:
                  errors.append(f"declared vargas missing their certification artifact: {sorted(missing)}")
              # Any artifact with no declared registry entry must be explicitly
              # named above, or it fails.
              unlisted_extra = artifacts - expected - ALLOWED_PRE_PRODUCTION
              if unlisted_extra:
                  errors.append(f"artifact(s) with no declared registry entry and not in the "
                                 f"explicit pre-production allow-list: {sorted(unlisted_extra)}")
              for name in sorted(artifacts):
                  report = json.loads((cert_dir / name).read_text())
                  if report.get("result") != "PASS":
                      errors.append(f"{name}: result is not PASS")
                  if not report.get("adr", "").startswith("ADR-"):
                      errors.append(f"{name}: missing or malformed adr field")
              return errors, declared, artifacts, expected

          errors, declared, artifacts, expected = check(Path("certification"))
          if errors:
              for e in errors:
                  print("FAIL:", e)
              sys.exit(1)
          print(f"PASS: {len(declared)} certified vargas, each with a PASS artifact "
                f"citing a compliant decision entry; "
                f"{len(artifacts - expected)} explicit pre-production artifact(s) accounted for")
          PY

      - name: Negative control, the varga-registry gate must actually fail on a stray artifact
        run: |
          python - <<'PY'
          import json, sys, tempfile, shutil
          from pathlib import Path
          import engine.astrology as ast

          # SAME check() body as the real assertion above (ADR-0084) - a copy
          # of the rule could silently drift from the rule, so this control
          # exists to prove the exemption stays narrow, not that some
          # unrelated logic behaves. Operates on a temporary copy of the real
          # artifacts; the real certification/ directory is never touched.
          ALLOWED_PRE_PRODUCTION = {
              "VARGA_D24_V1_certification.json",
          }

          def check(cert_dir):
              declared = set(tuple(x) for x in ast.CERTIFIED_PRODUCTION_VARGAS)
              expected = {f"VARGA_D{d}_V1_certification.json" for d, _ in declared}
              artifacts = {p.name for p in cert_dir.glob("VARGA_D*_V1_certification.json")}
              errors = []
              missing = expected - artifacts
              if missing:
                  errors.append(f"declared vargas missing their certification artifact: {sorted(missing)}")
              unlisted_extra = artifacts - expected - ALLOWED_PRE_PRODUCTION
              if unlisted_extra:
                  errors.append(f"artifact(s) with no declared registry entry and not in the "
                                 f"explicit pre-production allow-list: {sorted(unlisted_extra)}")
              for name in sorted(artifacts):
                  report = json.loads((cert_dir / name).read_text())
                  if report.get("result") != "PASS":
                      errors.append(f"{name}: result is not PASS")
                  if not report.get("adr", "").startswith("ADR-"):
                      errors.append(f"{name}: missing or malformed adr field")
              return errors

          with tempfile.TemporaryDirectory() as tmp:
              tmp_dir = Path(tmp)
              for p in Path("certification").glob("VARGA_D*_V1_certification.json"):
                  shutil.copy(p, tmp_dir / p.name)
              # Planted stray artifact: division 99 does not exist, is not
              # declared, and is not in ALLOWED_PRE_PRODUCTION.
              (tmp_dir / "VARGA_D99_V1_certification.json").write_text(
                  json.dumps({"result": "PASS", "adr": "ADR-0000"}))
              errors = check(tmp_dir)
          if not errors:
              print("varga-registry gate did NOT flag a planted stray artifact; its PASS above is worthless")
              sys.exit(1)
          print(f"negative control passed: planted stray artifact was caught ({errors})")
          PY
