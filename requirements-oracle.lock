# ORACLE CERTIFICATION LOCK  (VALIDATION_STANDARD.md s2 rule 4; ADR-0018)
#
# Self-contained, hash-pinned environment for the EIGHT external-oracle
# certification runners:
#   scripts/certify_d2.py   scripts/certify_d3.py   scripts/certify_d7.py
#   scripts/certify_d12.py  scripts/certify_d30.py  scripts/certify_vimshottari.py
#   scripts/certify_transits.py  scripts/certify_parashari_drishti.py
#
# WHY THIS FILE EXISTS
# PyJHora 4.8.7 declares an EMPTY Requires-Dist. Its runtime imports therefore
# fail one at a time on a clean machine and pip cannot resolve them. This file
# is the compensating control: it records the complete verified closure so the
# oracle environment is reproducible from the repository alone.
#
# The six dependencies PyJHora needs but does not declare are:
#   numpy, geocoder, pytz, timezonefinder, geopy, python-dateutil
# (discovered by iterative import failure in an isolated venv, 2026-08-10).
#
# INSTALL (exactly this command; --require-hashes is mandatory):
#   python -m pip install --require-hashes -r requirements-oracle.lock
#
# ENVIRONMENT CONSTRAINT
# The hashes below are for CPython 3.11, linux x86_64 wheels. This lock
# reproduces the environment recorded in certification/ORACLE_ENVIRONMENT.json
# and no other. A different Python minor version or platform MUST get its own
# lock and its own recorded environment identity; it must not be obtained by
# relaxing hashes.
#
# Base runtime pins (pyswisseph, tzdata, jsonschema, pytest) are included so
# this file is a single self-contained reproducibility unit. They agree with
# requirements.lock and engine/requirements-lock.txt.
#
# Regenerate: docs/CI_AND_ORACLE_REPRODUCIBILITY_SPEC.md section 6.

